spring.application.name=thindesk

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=thindesk
spring.data.mongodb.auto-index-creation=true
spring.session.mongodb.collection-name=sessoes

app.admin.nome=Administrador
app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_PASSWORD}
spring.config.import=optional:file:.env[.properties]

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.pfc=DEBUG
logging.level.org.springframework.security=DEBUG

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@thindesk.com}

app.base-url=${APP_BASE_URL:http://localhost:8080}

app.recuperacao.validade-minutos=30
app.recuperacao.log-link=${RECUPERACAO_LOG_LINK:false}

app.doisfatores.ativo=${DOIS_FATORES_ATIVO:true}
app.doisfatores.validade-minutos=10
app.doisfatores.max-tentativas=3
app.doisfatores.intervalo-reenvio-segundos=30
app.doisfatores.log-codigo=${DOIS_FATORES_LOG_CODIGO:false}