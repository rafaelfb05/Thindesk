<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esqueci minha senha - Thindesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <div class="text-center">
      <img th:src="@{/images/logo.png}" alt="Logo Thindesk" class="auth-logo">
      <h3 class="mb-3">Esqueci minha senha</h3>
    </div>

    <div class="alert alert-success" th:if="${param.enviado}">
      Se o e-mail estiver cadastrado, enviamos um link para redefinir a senha.
      Ele vale por 30 minutos.
    </div>

    <p class="text-muted" th:unless="${param.enviado}">
      Informe o e-mail da sua conta e enviaremos um link para criar uma nova senha.
    </p>

    <form th:action="@{/esqueci-senha}" th:object="${esqueci}" method="post" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" th:field="*{email}"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{email}"></div>
      </div>
      <button type="submit" class="btn btn-tema w-100">Enviar link</button>
    </form>

    <div class="mt-3 text-center">
      <a th:href="@{/login}" class="text-decoration-none">Voltar ao login</a>
    </div>
  </div>
</div>
</body>
</html>
