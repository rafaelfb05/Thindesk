<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Thindesk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card text-center">
        <img th:src="@{/images/logo.png}" alt="Logo Thindesk" class="auth-logo">
        <h3 class="mb-4">Bem-vindo</h3>

        <div class="alert alert-danger" th:if="${param.error}">
            E-mail ou senha inválidos.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            Você saiu do sistema.
        </div>
        <div class="alert alert-success" th:if="${param.registrado}">
            Cadastro realizado! Faça login para continuar.
        </div>
        <div class="alert alert-success" th:if="${param.senhaAlterada}">
            Senha alterada! Faça login com a nova senha.
        </div>
        <div class="alert alert-warning" th:if="${param.codigoBloqueado}">
            Muitas tentativas com código incorreto. Faça login novamente.
        </div>

        <form th:action="@{/login}" method="post" class="text-start">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Digite seu e-mail" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Digite sua senha" required>
                    <button type="button" class="btn btn-outline-secondary" data-toggle-senha
                            aria-label="Mostrar senha" title="Mostrar senha">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-tema w-100">Entrar</button>
        </form>

        <div class="mt-3">
            <a th:href="@{/esqueci-senha}" class="text-decoration-none">Esqueceu sua senha?</a>
        </div>
        <hr>
        <div>
            Ainda não tem conta? <a th:href="@{/registro}" class="text-decoration-none">Cadastre-se</a>
        </div>
    </div>
</div>
<script th:src="@{/js/senha-toggle.js}"></script>
</body>
</html>
