<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Redefinir senha - Thindesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <div class="text-center">
      <img th:src="@{/images/logo.png}" alt="Logo Thindesk" class="auth-logo">
      <h3 class="mb-4">Nova senha</h3>
    </div>

    <div th:if="${tokenInvalido}" class="text-center">
      <div class="alert alert-danger">Link inválido ou expirado.</div>
      <a th:href="@{/esqueci-senha}" class="btn btn-tema w-100">Solicitar novo link</a>
    </div>

    <form th:unless="${tokenInvalido}" th:action="@{/redefinir-senha}"
          th:object="${redefinir}" method="post" novalidate>
      <input type="hidden" th:field="*{token}">

      <div class="mb-3">
        <label for="senha" class="form-label">Nova senha</label>
        <div class="input-group has-validation">
          <input type="password" class="form-control" id="senha" th:field="*{senha}"
                 th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
          <button type="button" class="btn btn-outline-secondary" data-toggle-senha
                  aria-label="Mostrar senha" title="Mostrar senha">
            <i class="bi bi-eye"></i>
          </button>
          <div class="invalid-feedback" th:errors="*{senha}"></div>
        </div>
        <div class="form-text">
          De 8 a 64 caracteres, com maiúscula, minúscula, número e símbolo.
        </div>
      </div>

      <div class="mb-3">
        <label for="confirmarSenha" class="form-label">Confirmar nova senha</label>
        <div class="input-group has-validation">
          <input type="password" class="form-control" id="confirmarSenha" th:field="*{confirmarSenha}"
                 th:classappend="${#fields.hasErrors('confirmarSenha')} ? 'is-invalid'">
          <button type="button" class="btn btn-outline-secondary" data-toggle-senha
                  aria-label="Mostrar senha" title="Mostrar senha">
            <i class="bi bi-eye"></i>
          </button>
          <div class="invalid-feedback" th:errors="*{confirmarSenha}"></div>
        </div>
      </div>

      <button type="submit" class="btn btn-tema w-100">Salvar nova senha</button>
    </form>

    <div class="mt-3 text-center">
      <a th:href="@{/login}" class="text-decoration-none">Voltar ao login</a>
    </div>
  </div>
</div>
<script th:src="@{/js/senha-toggle.js}"></script>
</body>
</html>
