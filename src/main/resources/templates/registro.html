<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - Thindesk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="text-center">
            <img th:src="@{/images/logo.png}" alt="Logo Thindesk" class="auth-logo">
            <h3 class="mb-4">Criar conta</h3>
        </div>

        <form th:action="@{/registro}" th:object="${cadastro}" method="post" novalidate>

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="text" class="form-control" id="telefone" th:field="*{telefone}"
                           th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{telefone}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="setor" class="form-label">Setor</label>
                    <input type="text" class="form-control" id="setor" th:field="*{setor}"
                           th:classappend="${#fields.hasErrors('setor')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{setor}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <div class="input-group has-validation">
                    <input type="password" class="form-control" id="senha" th:field="*{senha}"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
                    <button type="button" class="btn btn-outline-secondary" data-toggle-senha
                            aria-label="Mostrar senha" title="Mostrar senha">
                        <i class="bi bi-eye"></i>
                    </button>
                    <div class="invalid-feedback" th:errors="*{senha}"></div>
                </div>
                <div class="form-text">
                    De 8 a 64 caracteres, com maiúscula, minúscula, número e símbolo.
                </div>
            </div>

            <div class="mb-3">
                <label for="confirmarSenha" class="form-label">Confirmar senha</label>
                <div class="input-group has-validation">
                    <input type="password" class="form-control" id="confirmarSenha" th:field="*{confirmarSenha}"
                           th:classappend="${#fields.hasErrors('confirmarSenha')} ? 'is-invalid'">
                    <button type="button" class="btn btn-outline-secondary" data-toggle-senha
                            aria-label="Mostrar senha" title="Mostrar senha">
                        <i class="bi bi-eye"></i>
                    </button>
                    <div class="invalid-feedback" th:errors="*{confirmarSenha}"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-tema w-100">Cadastrar</button>
        </form>

        <div class="mt-3 text-center">
            Já tem conta? <a th:href="@{/login}" class="text-decoration-none">Entrar</a>
        </div>
    </div>
</div>
<script th:src="@{/js/senha-toggle.js}"></script>
</body>
</html>
