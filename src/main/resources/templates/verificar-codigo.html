<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificação - Thindesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-container">
  <div class="auth-card text-center">
    <img th:src="@{/images/logo.png}" alt="Logo Thindesk" class="auth-logo">
    <h3 class="mb-3">Verificação em duas etapas</h3>

    <p class="text-muted">
      Enviamos um código de 6 dígitos para
      <strong th:text="${emailMascarado}">r***@gmail.com</strong>.
      Ele expira em alguns minutos.
    </p>

    <div class="alert alert-warning" th:if="${envioFalhou}">
      Não conseguimos enviar o e-mail agora. Use "Reenviar código" para tentar de novo.
    </div>
    <div class="alert alert-success" th:if="${param.reenviado}">
      Enviamos um novo código.
    </div>
    <div class="alert alert-warning" th:if="${param.aguarde}">
      Aguarde alguns segundos antes de pedir um novo código.
    </div>

    <form th:action="@{/verificar-codigo}" th:object="${codigoForm}" method="post"
          class="text-start" novalidate>
      <div class="mb-3">
        <label for="codigo" class="form-label">Código</label>
        <input type="text" id="codigo" class="form-control form-control-lg text-center"
               th:field="*{codigo}" maxlength="6" inputmode="numeric"
               autocomplete="one-time-code" placeholder="000000" autofocus
               th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{codigo}"></div>
      </div>
      <button type="submit" class="btn btn-tema w-100">Verificar</button>
    </form>

    <form th:action="@{/verificar-codigo/reenviar}" method="post" class="mt-3">
      <button type="submit" class="btn btn-link text-decoration-none p-0">Reenviar código</button>
    </form>

    <div class="mt-3">
      <a th:href="@{/login}" class="text-decoration-none">Voltar ao login</a>
    </div>
  </div>
</div>
</body>
</html>
